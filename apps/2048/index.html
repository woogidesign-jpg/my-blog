<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 · woogi.log</title>
  <meta name="description" content="같은 숫자를 밀어 합쳐 2048을 만드세요. 방향키·WASD·스와이프 지원, 최고 점수 저장.">
  <script>
    // 첫 화면이 그려지기 전에 블로그에서 고른 테마를 적용합니다 (깜빡임 방지).
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="ui.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <nav class="top-bar" aria-label="앱 메뉴">
        <a class="back-link" href="../../index.html" target="_top">← 블로그</a>
        <button class="button new-game" type="button" id="new-game">새 게임</button>
      </nav>
      <h1 class="title"><span class="title-prompt" aria-hidden="true">&gt; </span>2048<span class="cursor" aria-hidden="true"></span></h1>
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label" id="score-label">SCORE</span>
          <span class="score-value" id="score" aria-labelledby="score-label">0</span>
          <span class="score-float-anchor" id="score-float" aria-hidden="true"></span>
        </div>
        <div class="score-box">
          <span class="score-label" id="best-label">BEST</span>
          <span class="score-value" id="best" aria-labelledby="best-label">0</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="board-wrap">
        <div class="board" id="board" role="group" aria-label="2048 게임 보드" tabindex="-1">
          <div class="cell-grid" aria-hidden="true">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          </div>
          <div class="tile-layer" id="tile-layer" aria-hidden="true"></div>
        </div>

        <div class="overlay" id="overlay-win" role="dialog" aria-labelledby="overlay-win-title" hidden>
          <p class="overlay-title" id="overlay-win-title">&gt; 2048 달성!</p>
          <div class="overlay-actions">
            <button class="button button-primary" type="button" id="continue">계속하기</button>
            <button class="button" type="button" id="win-new-game">새 게임</button>
          </div>
        </div>

        <div class="overlay" id="overlay-over" role="dialog" aria-labelledby="overlay-over-title" aria-describedby="overlay-over-score" hidden>
          <p class="overlay-title" id="overlay-over-title">&gt; GAME OVER</p>
          <p class="overlay-score" id="overlay-over-score">점수 0</p>
          <div class="overlay-actions">
            <button class="button button-primary" type="button" id="retry">다시 하기</button>
          </div>
        </div>
      </div>

      <p class="hint">방향키·WASD 또는 스와이프로 타일을 밀어 2048을 만드세요.</p>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </main>
  </div>
</body>
</html>
