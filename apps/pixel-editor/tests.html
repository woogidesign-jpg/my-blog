<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>픽셀 에디터 테스트 · woogi.log</title>
  <style>
    :root {
      --bg: #000000;
      --text: #d9ffec;
      --muted: #8fb8a5;
      --pass: #39ff14;
      --fail: #ff4fd8;
      --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      line-height: 1.6;
    }
    h1 { font-size: 1.25rem; }
    .summary { font-weight: 700; }
    .pass { color: var(--pass); }
    .fail { color: var(--fail); }
    .detail { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
    ul { padding-left: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>&gt; 픽셀 에디터 editor.js · export.js 테스트</h1>
    <p class="summary" id="summary">실행 중…</p>
    <ul id="results"></ul>
  </main>

  <script type="module">
    import {
      SIZE, DEFAULT_PALETTE, createGrid, inBounds, getPixel, setPixel, setPixels, floodFill,
      linePoints, isEmpty, gridEquals, normalizeColor, serialize, deserialize,
      createHistory, commit, undo, redo, canUndo, canRedo
    } from './editor.js';
    import { toRgbaPixels, hexToRgb, renderToCanvas, makeFilename } from './export.js';

    const results = [];

    function same(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    function test(name, fn) {
      try {
        fn();
        results.push({ name, ok: true });
      } catch (err) {
        results.push({ name, ok: false, message: err.message });
        console.error(`실패: ${name}\n${err.message}`);
      }
    }

    function expectEqual(actual, expected, label = '') {
      if (!same(actual, expected)) {
        throw new Error(`${label} 기대값 ${JSON.stringify(expected)}, 실제값 ${JSON.stringify(actual)}`);
      }
    }

    function expect(condition, label) {
      if (!condition) throw new Error(label);
    }

    function countColor(grid, color) {
      let n = 0;
      grid.forEach((row) => row.forEach((c) => { if (c === color) n += 1; }));
      return n;
    }

    // 연속 점 사이 거리가 1칸(대각 포함) 이하인지
    function isContinuous(points) {
      for (let i = 1; i < points.length; i += 1) {
        const dx = Math.abs(points[i].x - points[i - 1].x);
        const dy = Math.abs(points[i].y - points[i - 1].y);
        if (dx > 1 || dy > 1) return false;
      }
      return true;
    }

    const RED = '#ff004d';
    const BLUE = '#29adff';

    // ---------- createGrid / 팔레트 ----------

    test('createGrid: 16×16, 모두 null', () => {
      const grid = createGrid();
      expectEqual(grid.length, 16, '행 수');
      expect(grid.every((row) => row.length === 16), '열 수 16');
      expect(grid.every((row) => row.every((c) => c === null)), '모두 null');
      expect(isEmpty(grid), 'isEmpty');
    });

    test('DEFAULT_PALETTE: 16색, 모두 정규화된 색', () => {
      expectEqual(DEFAULT_PALETTE.length, 16, '개수');
      DEFAULT_PALETTE.forEach((item) => expectEqual(normalizeColor(item.value), item.value, item.name));
      expectEqual(DEFAULT_PALETTE[8], { name: '빨강', value: '#ff004d' }, '9번');
    });

    test('inBounds / getPixel: 범위 밖은 false / null', () => {
      const grid = createGrid();
      expect(inBounds(grid, 0, 0) && inBounds(grid, 15, 15), '안쪽');
      expect(!inBounds(grid, -1, 0) && !inBounds(grid, 16, 0) && !inBounds(grid, 0, 16), '바깥');
      expectEqual(getPixel(grid, 20, 20), null);
    });

    // ---------- setPixel ----------

    test('setPixel: 값 설정, 원본 불변', () => {
      const grid = createGrid();
      const next = setPixel(grid, 3, 2, RED);
      expectEqual(getPixel(next, 3, 2), RED, '새 값');
      expectEqual(getPixel(grid, 3, 2), null, '원본');
      expect(next !== grid, '새 참조');
      expect(next[0] === grid[0], '바뀌지 않은 행은 공유');
    });

    test('setPixel: 같은 값이면 같은 참조', () => {
      const grid = setPixel(createGrid(), 1, 1, RED);
      expect(setPixel(grid, 1, 1, RED) === grid, '같은 색');
      expect(setPixel(createGrid(), 0, 0, null) !== undefined, 'null 동작');
      const empty = createGrid();
      expect(setPixel(empty, 0, 0, null) === empty, '빈 칸에 null');
    });

    test('setPixel: 범위 밖(-1, 16)이면 같은 참조', () => {
      const grid = createGrid();
      expect(setPixel(grid, -1, 0, RED) === grid, 'x -1');
      expect(setPixel(grid, 16, 0, RED) === grid, 'x 16');
      expect(setPixel(grid, 0, -1, RED) === grid, 'y -1');
      expect(setPixel(grid, 0, 16, RED) === grid, 'y 16');
    });

    test('setPixels: 여러 칸, 원본 불변, 변화 없으면 같은 참조', () => {
      const grid = createGrid();
      const next = setPixels(grid, [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }, { x: 99, y: 0 }], RED);
      expectEqual(countColor(next, RED), 3, '칠한 칸');
      expect(isEmpty(grid), '원본');
      expect(setPixels(next, [{ x: 0, y: 0 }, { x: 1, y: 1 }], RED) === next, '같은 색');
    });

    // ---------- linePoints ----------

    test('linePoints: (0,0)→(3,0) 4점', () => {
      expectEqual(linePoints(0, 0, 3, 0), [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 3, y: 0 }]);
    });

    test('linePoints: (0,0)→(3,3) 대각 4점', () => {
      expectEqual(linePoints(0, 0, 3, 3), [{ x: 0, y: 0 }, { x: 1, y: 1 }, { x: 2, y: 2 }, { x: 3, y: 3 }]);
    });

    test('linePoints: (2,5)→(2,5) 1점', () => {
      expectEqual(linePoints(2, 5, 2, 5), [{ x: 2, y: 5 }]);
    });

    test('linePoints: 역방향 (5,1)→(1,3) 양 끝 포함, 빈틈 없음', () => {
      const points = linePoints(5, 1, 1, 3);
      expectEqual(points[0], { x: 5, y: 1 }, '시작');
      expectEqual(points[points.length - 1], { x: 1, y: 3 }, '끝');
      expect(isContinuous(points), '연속');
      expectEqual(points.length, 5, '점 개수');
    });

    test('linePoints: 긴 대각선 (0,15)→(15,2) 연속', () => {
      const points = linePoints(0, 15, 15, 2);
      expect(isContinuous(points), '연속');
      expectEqual(points.length, 16, '점 개수');
    });

    // ---------- floodFill ----------

    test('floodFill: 빈 보드 전체 채움(256칸)', () => {
      const next = floodFill(createGrid(), 5, 5, RED);
      expectEqual(countColor(next, RED), 256);
    });

    test('floodFill: 닫힌 사각형 테두리 안쪽만 채움', () => {
      // (2,2)~(6,6) 테두리
      const border = [];
      for (let i = 2; i <= 6; i += 1) {
        border.push({ x: i, y: 2 }, { x: i, y: 6 }, { x: 2, y: i }, { x: 6, y: i });
      }
      const grid = setPixels(createGrid(), border, BLUE);
      const next = floodFill(grid, 4, 4, RED);
      expectEqual(countColor(next, RED), 9, '안쪽 3×3');
      expectEqual(countColor(next, BLUE), 16, '테두리 유지');
      expectEqual(getPixel(next, 0, 0), null, '바깥 그대로');
    });

    test('floodFill: 대각선으로만 닿은 칸은 안 채움', () => {
      // (1,0),(0,1)로 (0,0)을 막고, 대각선 (1,1)은 비워 둠
      const grid = setPixels(createGrid(), [{ x: 1, y: 0 }, { x: 0, y: 1 }], BLUE);
      const next = floodFill(grid, 0, 0, RED);
      expectEqual(countColor(next, RED), 1, '(0,0)만');
      expectEqual(getPixel(next, 1, 1), null, '대각 칸');
    });

    test('floodFill: 같은 색이면 같은 참조', () => {
      const grid = floodFill(createGrid(), 0, 0, RED);
      expect(floodFill(grid, 3, 3, RED) === grid, '같은 색');
      const empty = createGrid();
      expect(floodFill(empty, 0, 0, null) === empty, '빈 칸에 null');
      expect(floodFill(empty, -1, 0, RED) === empty, '범위 밖');
    });

    test('floodFill: 칠해진 영역의 색 바꾸기', () => {
      const grid = setPixels(createGrid(), [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }, { x: 5, y: 5 }], BLUE);
      const next = floodFill(grid, 1, 0, RED);
      expectEqual(countColor(next, RED), 3, '연결된 3칸');
      expectEqual(getPixel(next, 5, 5), BLUE, '떨어진 칸 유지');
      expectEqual(countColor(grid, RED), 0, '원본 불변');
    });

    // ---------- normalizeColor ----------

    test('normalizeColor: 올바른 값', () => {
      expectEqual(normalizeColor('#FF004D'), '#ff004d');
      expectEqual(normalizeColor('#abc'), '#aabbcc');
    });

    test('normalizeColor: 잘못된 값은 null', () => {
      ['red', '#12345', 'url(x)', null, undefined, 123, '#gggggg', '#ff004d00', ''].forEach((value) => {
        expectEqual(normalizeColor(value), null, String(value));
      });
    });

    // ---------- serialize / deserialize ----------

    test('serialize/deserialize 왕복 일치', () => {
      const grid = setPixels(createGrid(), [{ x: 0, y: 0 }, { x: 15, y: 15 }, { x: 3, y: 7 }], RED);
      const data = serialize(grid);
      expectEqual(data.v, 1);
      expectEqual(data.size, 16);
      expectEqual(data.pixels.length, 256);
      expectEqual(data.pixels[7 * 16 + 3], RED, '행 우선 index');
      const back = deserialize(JSON.parse(JSON.stringify(data)));
      expect(gridEquals(back, grid), '왕복');
    });

    test('deserialize: 대문자 색은 정규화', () => {
      const data = serialize(createGrid());
      data.pixels[0] = '#FF004D';
      expectEqual(getPixel(deserialize(data), 0, 0), RED);
    });

    test('deserialize: 잘못된 데이터는 null', () => {
      const good = serialize(createGrid());
      expectEqual(deserialize({ ...good, v: 2 }), null, 'v 다름');
      expectEqual(deserialize({ ...good, size: 8 }), null, 'size 다름');
      expectEqual(deserialize({ ...good, pixels: good.pixels.slice(1) }), null, '길이 255');
      const badColor = good.pixels.slice();
      badColor[10] = 'red';
      expectEqual(deserialize({ ...good, pixels: badColor }), null, '잘못된 색');
      expectEqual(deserialize('{"v":1}'), null, '문자열 JSON');
      expectEqual(deserialize({ v: 1 }), null, 'pixels 없음');
      expectEqual(deserialize(null), null, 'null');
      expectEqual(deserialize([]), null, '배열');
    });

    // ---------- 히스토리 ----------

    test('히스토리: commit 3회 → undo 2회 → redo 1회', () => {
      const g0 = createGrid();
      const g1 = setPixel(g0, 0, 0, RED);
      const g2 = setPixel(g1, 1, 0, RED);
      const g3 = setPixel(g2, 2, 0, RED);
      let h = createHistory(g0);
      expect(!canUndo(h) && !canRedo(h), '처음');
      h = commit(commit(commit(h, g1), g2), g3);
      expect(h.present === g3 && h.past.length === 3, 'commit 3회');
      h = undo(undo(h));
      expect(h.present === g1, 'undo 2회 → g1');
      expect(canUndo(h) && canRedo(h), '둘 다 가능');
      expectEqual(h.future.length, 2, 'future 2');
      h = redo(h);
      expect(h.present === g2, 'redo → g2');
      expectEqual(h.past.length, 2, 'past 2');
      expectEqual(h.future.length, 1, 'future 1');
    });

    test('히스토리: undo 후 commit 시 future 비움', () => {
      const g0 = createGrid();
      const g1 = setPixel(g0, 0, 0, RED);
      const g2 = setPixel(g1, 1, 0, RED);
      let h = commit(commit(createHistory(g0), g1), g2);
      h = undo(h);
      const g3 = setPixel(g1, 5, 5, BLUE);
      h = commit(h, g3);
      expectEqual(h.future.length, 0, 'future');
      expect(!canRedo(h), 'redo 불가');
      expect(h.present === g3, 'present');
    });

    test('히스토리: limit 초과 시 가장 오래된 것 제거', () => {
      let grid = createGrid();
      let h = createHistory(grid, 3);
      const snapshots = [grid];
      for (let i = 0; i < 5; i += 1) {
        grid = setPixel(grid, i, 0, RED);
        snapshots.push(grid);
        h = commit(h, grid);
      }
      expectEqual(h.past.length, 3, 'past 길이');
      expect(h.past[0] === snapshots[2], '가장 오래된 것은 3번째 스냅샷');
    });

    test('히스토리: 같은 grid commit은 무시, 빈 undo/redo는 그대로', () => {
      const h = createHistory(createGrid());
      expect(commit(h, h.present) === h, '같은 grid');
      expect(undo(h) === h, 'undo');
      expect(redo(h) === h, 'redo');
      expectEqual(h.limit, 100, '기본 limit');
    });

    // ---------- export.js ----------

    test('hexToRgb', () => {
      expectEqual(hexToRgb('#ff004d'), [255, 0, 77]);
      expectEqual(hexToRgb('#000000'), [0, 0, 0]);
      expectEqual(hexToRgb('#29adff'), [41, 173, 255]);
    });

    function rgbaAt(image, x, y) {
      const i = (y * image.width + x) * 4;
      return Array.from(image.data.slice(i, i + 4));
    }

    test('toRgbaPixels: scale 1에서 (3,2) 색, 빈 칸 알파 0', () => {
      const grid = setPixel(createGrid(), 3, 2, RED);
      const image = toRgbaPixels(grid, 1);
      expectEqual([image.width, image.height], [16, 16], '크기');
      expectEqual(image.data.length, 16 * 16 * 4, '길이');
      expectEqual(rgbaAt(image, 3, 2), [255, 0, 77, 255], '(3,2)');
      expectEqual(rgbaAt(image, 0, 0), [0, 0, 0, 0], '빈 칸');
    });

    test('toRgbaPixels: scale 16에서 256×256, 칸 경계 정확', () => {
      const grid = setPixel(setPixel(createGrid(), 3, 2, RED), 4, 2, BLUE);
      const image = toRgbaPixels(grid, 16);
      expectEqual([image.width, image.height], [256, 256], '크기');
      expectEqual(rgbaAt(image, 48, 32), [255, 0, 77, 255], '왼쪽 위');
      expectEqual(rgbaAt(image, 63, 32), [255, 0, 77, 255], '오른쪽 위');
      expectEqual(rgbaAt(image, 48, 47), [255, 0, 77, 255], '왼쪽 아래');
      expectEqual(rgbaAt(image, 63, 47), [255, 0, 77, 255], '오른쪽 아래');
      expectEqual(rgbaAt(image, 64, 32), [41, 173, 255, 255], '옆 칸');
      expectEqual(rgbaAt(image, 47, 32), [0, 0, 0, 0], '왼쪽 빈 칸');
      expectEqual(rgbaAt(image, 48, 48), [0, 0, 0, 0], '아래 빈 칸');
    });

    test('toRgbaPixels: 원본 grid 불변', () => {
      const grid = setPixel(createGrid(), 0, 0, RED);
      const before = JSON.stringify(grid);
      toRgbaPixels(grid, 8);
      expectEqual(JSON.stringify(grid), before);
    });

    test('canvas 왕복: renderToCanvas(grid, 16) 칸 중앙·경계 픽셀', () => {
      // 네 모서리 서로 다른 색, 가운데 비움, 나머지 일부 칠함
      let grid = createGrid();
      grid = setPixel(grid, 0, 0, '#ff004d');
      grid = setPixel(grid, 15, 0, '#00e436');
      grid = setPixel(grid, 0, 15, '#29adff');
      grid = setPixel(grid, 15, 15, '#ffec27');
      grid = setPixel(grid, 1, 0, '#1d2b53');
      grid = setPixels(grid, linePoints(2, 8, 13, 8), '#ff77a8');
      grid = setPixel(grid, 7, 8, null);
      const scale = 16;
      const canvas = renderToCanvas(grid, scale);
      expectEqual([canvas.width, canvas.height], [256, 256], '크기');
      const ctx = canvas.getContext('2d');
      const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < SIZE; y += 1) {
        for (let x = 0; x < SIZE; x += 1) {
          const color = grid[y][x];
          const expected = color ? [...hexToRgb(color), 255] : [0, 0, 0, 0];
          const center = rgbaAt(image, x * scale + 8, y * scale + 8);
          if (color) {
            expectEqual(center, expected, `(${x},${y}) 중앙`);
          } else {
            expectEqual(center[3], 0, `(${x},${y}) 빈 칸 알파`);
          }
        }
      }
      // 경계: (0,0) 빨강 | (1,0) 남색 — 경계 양쪽 픽셀은 정확히 두 색 중 하나
      expectEqual(rgbaAt(image, 15, 5), [255, 0, 77, 255], '경계 왼쪽');
      expectEqual(rgbaAt(image, 16, 5), [29, 43, 83, 255], '경계 오른쪽');
      // 칠한 칸 | 빈 칸 경계
      expectEqual(rgbaAt(image, 31, 5), [29, 43, 83, 255], '빈 칸 경계 왼쪽');
      expectEqual(rgbaAt(image, 32, 5)[3], 0, '빈 칸 경계 오른쪽');
    });

    test('canvas 왕복: 각 배율 크기 (1/8/16/32)', () => {
      [1, 8, 16, 32].forEach((scale) => {
        const canvas = renderToCanvas(createGrid(), scale);
        expectEqual([canvas.width, canvas.height], [16 * scale, 16 * scale], `${scale}×`);
      });
    });

    test('makeFilename: 로컬 시각 형식', () => {
      expectEqual(makeFilename(new Date(2026, 9, 21, 15, 30, 45)), 'pixel-art-20261021-153045.png');
      expectEqual(makeFilename(new Date(2026, 0, 2, 3, 4, 5)), 'pixel-art-20260102-030405.png');
    });

    // ---------- 결과 표시 ----------

    const list = document.getElementById('results');
    results.forEach((r) => {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.textContent = `${r.ok ? '통과' : '실패'} · ${r.name}`;
      if (!r.ok) {
        const detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent = r.message;
        li.appendChild(detail);
      }
      list.appendChild(li);
    });
    const passed = results.filter((r) => r.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = `${passed} / ${results.length} 통과`;
    summary.className = `summary ${passed === results.length ? 'pass' : 'fail'}`;
    document.title = `${passed}/${results.length} · 픽셀 에디터 테스트`;
  </script>
</body>
</html>
