<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="theme-color" content="#000000">
  <title>내 블로그</title>
  <script>
    // 저장된 테마를 렌더링 전에 적용해 깜빡임을 막습니다. (기본은 검은 배경 네온 테마)
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/post.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="./"><span class="prompt">&gt;</span>내_블로그<span class="cursor" aria-hidden="true">_</span></a>
      <button class="theme-toggle" type="button" aria-label="라이트 모드로 전환" aria-pressed="false">☀</button>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="./">&lt;- 목록으로</a>
    <div id="post" aria-live="polite">
      <p class="status">글을 불러오는 중…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 내 블로그</span>
      <span>HTML · CSS · JavaScript</span>
    </div>
  </footer>
</body>
</html>
