<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>woogi.log</title>
  <meta name="description" content="woogi.log의 글입니다.">
  <script>
    // 첫 화면이 그려지기 전에 저장된 테마를 적용합니다 (깜빡임 방지).
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/post.js"></script>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./"><span class="brand-path">~/</span>woogi.log</a>
      <button class="theme-toggle" type="button" aria-label="라이트 테마" aria-pressed="false">
        <span class="theme-toggle-label">DARK</span>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <nav class="breadcrumb" aria-label="이동">
      <a href="./">← 글 목록</a>
    </nav>
    <article id="post" class="post" aria-live="polite"></article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 woogi · 순수 HTML·CSS·JS로 만들었습니다</p>
    </div>
