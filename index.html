<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>woogi.log</title>
  <meta name="description" content="프레임워크 없이 HTML, CSS, JavaScript로 만든 개인 블로그입니다.">
  <script>
    // 첫 화면이 그려지기 전에 저장된 테마를 적용합니다 (깜빡임 방지).
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-current="page"><span class="brand-path">~/</span>woogi.log</a>
      <button class="theme-toggle" type="button" aria-label="라이트 테마" aria-pressed="false">
        <span class="theme-toggle-label">DARK</span>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero" aria-labelledby="hero-title">
      <p class="prompt">whoami</p>
      <h1 id="hero-title" class="hero-title">만들고 배운 것을<br>기록합니다<span class="cursor" aria-hidden="true"></span></h1>
      <p class="hero-text">프레임워크 없이 HTML, CSS, JavaScript만으로 만든 블로그입니다. 글은 마크다운으로 쓰고, 브라우저가 바로 읽어서 보여줍니다.</p>
    </section>

    <section class="apps" aria-labelledby="apps-title">
      <div class="section-head">
        <h2 id="apps-title" class="prompt">ls apps/</h2>
        <p class="section-count">1 app</p>
      </div>
      <div class="post-grid">
        <article class="card card--app">
          <img class="card-thumb" src="apps/2048/preview.png" width="1200" height="630" alt="네온 테마 2048 게임 화면: 점수판과 2부터 2048까지의 타일이 놓인 4×4 보드" loading="lazy">
          <p class="card-meta"><span class="badge">APP</span>게임</p>
          <h3 class="card-title"><a class="card-link" href="apps/2048/">2048</a></h3>
          <p class="card-description">같은 숫자를 밀어 합쳐 2048을 만드세요. 방향키·WASD·스와이프 지원, 최고 점수 저장.</p>
          <ul class="tag-list" aria-label="태그">
            <li class="tag">#game</li>
            <li class="tag">#puzzle</li>
          </ul>
        </article>
      </div>
    </section>

    <section class="posts" aria-labelledby="posts-title">
      <div class="section-head">
        <h2 id="posts-title" class="prompt">ls posts/</h2>
        <p id="post-count" class="section-count"></p>
      </div>
      <div id="post-list" class="post-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 woogi · 순수 HTML·CSS·JS로 만들었습니다</p>
    </div>
  </footer>
</body>
</html>
